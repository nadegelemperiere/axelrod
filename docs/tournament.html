<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament · Axelrod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-tournaments">

  <div class="app">

    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="admin.html" class="logo">
          <img src="imgs/logo.png" alt="Axelrod" class="logo-mark" />
          <div class="logo-text">
            <div class="logo-name">Axelrod</div>
            <div class="logo-tagline" data-i18n="app.tagline">The Tournament of Minds</div>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section admin-only" hidden>
          <p class="sidebar-section-label" data-i18n="sidebar.admin">Admin</p>
          <a href="admin.html" class="sidebar-link active" data-page="admin-tournaments">
            <img src="imgs/tournament.png" alt="" class="sidebar-icon" />
            <div class="sidebar-link-text">
              <div class="sidebar-link-title" data-i18n="sidebar.tournaments">Tournaments</div>
              <div class="sidebar-link-desc" data-i18n="sidebar.tournaments.adminDesc">Manage active tournaments</div>
            </div>
          </a>
          <a href="teams.html" class="sidebar-link" data-page="admin-teams">
            <img src="imgs/strategies.png" alt="" class="sidebar-icon" />
            <div class="sidebar-link-text">
              <div class="sidebar-link-title" data-i18n="teams.admin.title">Teams</div>
              <div class="sidebar-link-desc" data-i18n="teams.admin.subtitle">Create and manage teams</div>
            </div>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="user-avatar">—</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="user-name">—</div>
            <div class="sidebar-user-role" id="user-role">—</div>
          </div>
          <button class="lang-toggle" type="button" aria-label="Toggle language">FR</button>
          <button class="sidebar-logout" id="logout-btn" type="button" data-i18n-title="app.logout" title="Sign out">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="content">

      <div class="content-header">
        <div>
          <p class="card-kicker"><a href="admin.html" style="color: var(--muted);" data-i18n="tournament.back">← Tournaments</a></p>
          <h1 id="t-title" data-i18n="tournament.title.fallback">Tournament</h1>
          <p class="lede" id="t-meta"></p>
        </div>
      </div>

      <p id="access-denied" class="access-denied" hidden data-i18n="access.denied">
        Access denied — this account doesn't have admin role.
      </p>

      <main id="main" hidden>
        <section class="card">
          <h2 data-i18n="tournament.add.title">Add a team</h2>
          <form id="add-form">
            <label>
              <span data-i18n="tournament.add.label">Pick an unassigned team</span>
              <select id="t-pick" required></select>
            </label>
            <p id="add-empty-hint" class="muted small" hidden data-i18n="tournament.add.empty">
              No unassigned team available.
            </p>
            <button type="submit" id="add-btn" data-i18n="tournament.add.submit">Add to tournament</button>
            <p id="add-msg" class="validation-msg" hidden></p>
          </form>
        </section>

        <section class="card">
          <h2 data-i18n="tournament.teams.title">Teams in this tournament</h2>
          <ul id="teams-list" class="t-list"></ul>
        </section>
      </main>

    </div>
  </div>

  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/tournament.js"></script>
</body>
</html>
