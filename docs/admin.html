<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournaments · Axelrod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-tournaments">

  <div class="app">

    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="admin.html" class="logo">
          <img src="imgs/logo.png" alt="Axelrod" class="logo-mark" />
          <div class="logo-text">
            <div class="logo-name">Axelrod</div>
            <div class="logo-tagline" data-i18n="app.tagline">The Tournament of Minds</div>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section admin-only" hidden>
          <p class="sidebar-section-label" data-i18n="sidebar.admin">Admin</p>
          <a href="admin.html" class="sidebar-link" data-page="admin-tournaments">
            <img src="imgs/tournament.png" alt="" class="sidebar-icon" />
            <div class="sidebar-link-text">
              <div class="sidebar-link-title" data-i18n="sidebar.tournaments">Tournaments</div>
              <div class="sidebar-link-desc" data-i18n="sidebar.tournaments.adminDesc">Manage active tournaments</div>
            </div>
          </a>
          <a href="teams.html" class="sidebar-link" data-page="admin-teams">
            <img src="imgs/strategies.png" alt="" class="sidebar-icon" />
            <div class="sidebar-link-text">
              <div class="sidebar-link-title" data-i18n="teams.admin.title">Teams</div>
              <div class="sidebar-link-desc" data-i18n="teams.admin.subtitle">Create and manage teams</div>
            </div>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="user-avatar">—</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="user-name">—</div>
            <div class="sidebar-user-role" id="user-role">—</div>
          </div>
          <button class="lang-toggle" type="button" aria-label="Toggle language">FR</button>
          <button class="sidebar-logout" id="logout-btn" type="button" data-i18n-title="app.logout" title="Sign out">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="content">

      <div class="content-header content-header-row">
        <div>
          <h1 data-i18n="admin.title">Tournaments</h1>
          <p class="lede" data-i18n="admin.subtitle">Create and run class tournaments.</p>
        </div>
        <button type="button" id="open-create-btn" class="primary-cta" data-i18n="admin.create.open">Create a tournament</button>
      </div>

      <p id="access-denied" class="access-denied" hidden data-i18n="access.denied">
        Access denied — this account doesn't have admin role.
      </p>

      <main id="main" hidden>
        <div class="tab-bar tournament-tabs">
          <button type="button" class="tab-btn active" data-filter="all" data-i18n="admin.tab.all">All</button>
          <button type="button" class="tab-btn" data-filter="active" data-i18n="admin.tab.active">In progress</button>
          <button type="button" class="tab-btn" data-filter="completed" data-i18n="admin.tab.completed">Completed</button>
        </div>

        <ul id="t-list" class="tournament-admin-list"></ul>
      </main>

      <!-- Create tournament modal -->
      <div id="create-modal" class="modal-backdrop" hidden>
        <div class="modal" role="dialog" aria-modal="true" style="max-width: 560px;">
          <div class="modal-head">
            <h2 data-i18n="admin.create.title">Create a tournament</h2>
            <button class="modal-close" type="button" data-modal-close>×</button>
          </div>
          <div class="modal-section">
            <form id="create-form">
              <label>
                <span data-i18n="admin.create.name">Tournament name</span>
                <input type="text" id="t-name" required maxlength="80" data-i18n-placeholder="admin.create.name.placeholder" placeholder="e.g. Axelrod Junior — June 2026">
              </label>
              <div class="row">
                <label>
                  <span data-i18n="admin.create.turns">Rounds per match</span>
                  <input type="number" id="t-turns" value="30" min="5" max="200" required>
                </label>
                <label>
                  <span data-i18n="admin.create.noise">Noise level (0 to 0.5)</span>
                  <input type="number" id="t-noise" value="0" step="0.05" min="0" max="0.5" required>
                </label>
              </div>
              <div style="display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1rem;">
                <button type="button" data-modal-close data-i18n="modal.cancel">Cancel</button>
                <button type="submit" data-i18n="admin.create.submit">Create</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
